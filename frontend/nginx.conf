server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker: адрес backend определяется заново, а не один раз при старте nginx.
    # Иначе после пересоздания контейнера backend (новый IP) все запросы к API дают 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API на том же адресе, что и интерфейс: фронтенду не нужен CORS и адрес бэкенда
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;  # переменная без URI — путь запроса передаётся как есть
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1100m;   # несколько файлов до 100 МБ за раз
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_buffering off;          # Server-Sent Events (/api/analyses/{id}/events)
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
