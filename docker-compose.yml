services:
  db:
    image: pgvector/pgvector:pg16
    container_name: b2b_postgres
    restart: always
    environment:
      POSTGRES_DB: b2b_procurement
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d b2b_procurement"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
